name: 💡 Feature Request
description: Suggest a new feature or improvement
title: "[FEATURE]: "
labels: ["feature"]

body:
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: Explain your idea and how it would improve the product
      placeholder: |
        Example:
        I would like to have a discount system that applies automatically based on customer type...
    validations:
      required: true

  - type: textarea
    id: use_case
    attributes:
      label: Use case
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: false

  - type: dropdown
    id: user_type
    attributes:
      label: You are
      options:
        - POS User
        - Business Owner
        - Developer
        - Tester
        - Other
    validations:
      required: true
