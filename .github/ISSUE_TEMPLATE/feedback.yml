name: Feedback / Bug Report / Feature Request
description: Share feedback, report a bug, or request a feature
title: "[FEEDBACK] "
labels: ["feedback"]

body:
  - type: dropdown
    id: type
    attributes:
      label: What do you want to report?
      options:
        - 🐞 Bug Report
        - 💡 Feature Request
        - 🗣️ General Feedback
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe your request
      description: |
        🐞 Bug Report → Describe the issue in detail, when it happens, and what causes it. Please also include the app version, and attach screenshots or a video to help us understand the problem clearly.
        💡 Feature Request → Explain your idea and how it would improve the product
        🗣️ Feedback → Share your overall experience (positive or negative)
      placeholder: |
        Example:
        When I open the POS screen and add a product, the system freezes for about 3 seconds...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce (for bugs only)
      description: |
        For bugs: write step-by-step reproduction
        For features/feedback: write N/A
      placeholder: |
        1. Open POS
        2. Select a product
        3. Click Checkout
        4. The issue appears
    validations:
      required: false

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: |
        🐞 Bug → What should have happened
        💡 Feature → Expected behavior or outcome of the feature
      placeholder: |
        The checkout process should complete instantly without delay
    validations:
      required: false

  - type: dropdown
    id: user_type
    attributes:
      label: You are
      options:
        - POS User (Cashier / Staff)
        - Business Owner
        - Developer
        - Tester
        - Other
    validations:
      required: true
